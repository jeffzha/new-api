name: Build agency release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: Dockerfile
            image: new-api-seedance
          - name: agency-hub
            dockerfile: deploy/agency-hub/Dockerfile
            image: new-api-agency-hub
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/${{ matrix.name }}-image.tar
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_VERSION=agency.${{ github.sha }}
            BUN_REGISTRY=https://registry.npmmirror.com
            GO_PROXY=https://goproxy.cn,direct
          cache-from: type=gha,scope=agency-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=agency-${{ matrix.name }}

      - name: Write checksum
        run: sha256sum /tmp/${{ matrix.name }}-image.tar > /tmp/SHA256SUMS

      - name: Upload immutable image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agency-${{ matrix.name }}-${{ github.sha }}-linux-amd64
          path: |
            /tmp/${{ matrix.name }}-image.tar
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
