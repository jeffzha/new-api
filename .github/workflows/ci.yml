name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-billing:
    name: Manual Seedance billing verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      GOPROXY: https://goproxy.cn,direct
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Test Seedance pricing and task adaptors
        run: go test ./setting/seedance_video_pricing ./model ./relay/channel/task/doubao ./relay/channel/task/openaiseedance ./relay/channel/task/taskcommon -count=1
      - name: Build gateway
        run: go build .

  backend:
    name: Backend vet, build, and test
    if: github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  ops-finance-export:
    name: Ops finance export three databases
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ops_finance_export_test
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ops_finance_export_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ops_finance_export_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      AGENCY_HUB_RUN_EXTERNAL_DB_TESTS: "1"
      AGENCY_HUB_TEST_MYSQL_DSN: root:rootpass@tcp(127.0.0.1:3306)/ops_finance_export_test?charset=utf8mb4&parseTime=True&loc=UTC
      AGENCY_HUB_TEST_POSTGRES_DSN: host=127.0.0.1 user=postgres password=postgres dbname=ops_finance_export_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify finance export on all three databases
        run: go test ./service/opsexport -run '^TestOpsExportFinanceRangeAcrossDatabases$' -count=1 -v
