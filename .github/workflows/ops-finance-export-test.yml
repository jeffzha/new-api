name: Ops finance export compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-export:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ops_finance_export_test
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ops_finance_export_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ops_finance_export_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      AGENCY_HUB_RUN_EXTERNAL_DB_TESTS: "1"
      AGENCY_HUB_TEST_MYSQL_DSN: root:rootpass@tcp(127.0.0.1:3306)/ops_finance_export_test?charset=utf8mb4&parseTime=True&loc=UTC
      AGENCY_HUB_TEST_POSTGRES_DSN: host=127.0.0.1 user=postgres password=postgres dbname=ops_finance_export_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify finance export on all three databases
        run: go test ./service/opsexport -run '^TestOpsExportFinanceRangeAcrossDatabases$' -count=1 -v
