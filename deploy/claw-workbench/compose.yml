services:
  workbench-control-db:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16.4-alpine}
    environment:
      POSTGRES_DB: ${CLAW_DB_NAME:-claw_control}
      POSTGRES_USER: ${CLAW_DB_USER:-claw_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/control_db_password
      TZ: ${POSTGRES_TIMEZONE:-UTC}
    secrets:
      - control_db_password
    volumes:
      - control_db_data:/var/lib/postgresql/data
    networks:
      - workbench_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
    mem_limit: ${POSTGRES_MEMORY:-1g}

  workbench-adp-db:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16.4-alpine}
    environment:
      POSTGRES_DB: ${ADP_DB_NAME:-adp_workbench}
      POSTGRES_USER: ${ADP_DB_USER:-adp_workbench}
      POSTGRES_PASSWORD_FILE: /run/secrets/adp_db_password
      TZ: ${POSTGRES_TIMEZONE:-UTC}
    secrets:
      - adp_db_password
    volumes:
      - adp_db_data:/var/lib/postgresql/data
    networks:
      - workbench_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
    mem_limit: ${POSTGRES_MEMORY:-1g}

  workbench-redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.4-alpine}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - workbench_backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: ${REDIS_MEMORY:-512m}

  workbench-clamav:
    <<: *service-defaults
    image: ${CLAMAV_IMAGE:-docker.m.daocloud.io/clamav/clamav:stable-debian}
    user: clamav
    entrypoint: ["/init-unprivileged"]
    environment:
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_STREAM_MAX_BYTES:-52428800}
      CLAMD_CONF_MaxFileSize: ${CLAMAV_MAX_FILE_BYTES:-52428800}
      CLAMD_CONF_MaxScanSize: ${CLAMAV_MAX_SCAN_BYTES:-104857600}
      FRESHCLAM_CONF_Checks: ${CLAMAV_FRESHCLAM_CHECKS:-12}
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - workbench_backend
      - workbench_egress
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 6m
    cap_drop:
      - ALL
    cpus: ${CLAMAV_CPUS:-2.0}
    mem_limit: ${CLAMAV_MEMORY:-4g}
    pids_limit: 512
    stop_grace_period: 90s

  claw-control-blue:
    <<: *service-defaults
    image: ${CLAW_CONTROL_IMAGE_BLUE:?set CLAW_CONTROL_IMAGE_BLUE to an immutable release ref}
    build:
      context: ../..
      dockerfile: deploy/claw-workbench/docker/Dockerfile.claw-control
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE:-docker.m.daocloud.io/library/golang:1.22-alpine}
        BUN_BUILD_IMAGE: ${BUN_BUILD_IMAGE:-docker.m.daocloud.io/oven/bun:1.3.6-alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      <<: *control-environment
    secrets: &control-secrets
      - control_db_password
      - redis_password
      - claw_admin_token
      - new_api_control_hmac
      - adp_control_hmac
      - new_api_identity_hmac
      - evidence_master_key
      - internal_ca
    volumes:
      - ./secrets/provider:/run/workbench/provider-secrets:ro
      - ./secrets/billing:/run/workbench/billing-secrets:ro
      - evidence_data:/var/lib/claw-control/evidence
    networks:
      - workbench_backend
      - workbench_egress
    depends_on:
      workbench-control-db:
        condition: service_healthy
      workbench-redis:
        condition: service_healthy
      workbench-clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cpus: ${CLAW_CONTROL_CPUS:-1.0}
    mem_limit: ${CLAW_CONTROL_MEMORY:-512m}
    pids_limit: 256
    stop_grace_period: 20s

  claw-control-green:
    <<: *service-defaults
    image: ${CLAW_CONTROL_IMAGE_GREEN:?set CLAW_CONTROL_IMAGE_GREEN to an immutable release ref}
    build:
      context: ../..
      dockerfile: deploy/claw-workbench/docker/Dockerfile.claw-control
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE:-docker.m.daocloud.io/library/golang:1.22-alpine}
        BUN_BUILD_IMAGE: ${BUN_BUILD_IMAGE:-docker.m.daocloud.io/oven/bun:1.3.6-alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      <<: *control-environment
    secrets: *control-secrets
    volumes:
      - ./secrets/provider:/run/workbench/provider-secrets:ro
      - ./secrets/billing:/run/workbench/billing-secrets:ro
      - evidence_data:/var/lib/claw-control/evidence
    networks:
      - workbench_backend
      - workbench_egress
    depends_on:
      workbench-control-db:
        condition: service_healthy
      workbench-redis:
        condition: service_healthy
      workbench-clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cpus: ${CLAW_CONTROL_CPUS:-1.0}
    mem_limit: ${CLAW_CONTROL_MEMORY:-512m}
    pids_limit: 256
    stop_grace_period: 20s

  adp-blue:
    <<: *service-defaults
    image: ${ADP_WORKBENCH_IMAGE_BLUE:?set ADP_WORKBENCH_IMAGE_BLUE to an immutable release ref}
    build: &adp-build
      context: ../..
      dockerfile: deploy/claw-workbench/docker/Dockerfile.adp
      additional_contexts:
        adp_source: ${ADP_SOURCE_DIR:-../../../adp-chat-client-claw}
      args:
        PYTHON_BUILD_IMAGE: ${PYTHON_BUILD_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      <<: *adp-environment
      WORKBENCH_INSTANCE_ID: adp-blue
    secrets: &adp-secrets
      - adp_db_password
      - redis_password
      - adp_session_secret
      - adp_control_hmac
      - adp_usage_evidence_key
      - adp_file_locator_key
      - adp_file_locator_previous_keys
      - adp_workspace_locator_key
      - adp_workspace_locator_previous_keys
      - adp_connector_token_key
      - adp_connector_token_previous_keys
      - adp_oauth_state_key
      - adp_oauth_state_previous_keys
      - internal_ca
    volumes:
      - adp_blue_logs:/app/logs
      - ./config:/run/workbench/config:ro
      - ./secrets/oauth:/run/workbench/oauth-secrets:ro
      - ./secrets/files:/run/workbench/file-secrets:ro
      - ./secrets/sandbox:/run/secrets/workbench-sandbox:ro
    networks:
      - workbench_backend
      - workbench_egress
    depends_on:
      workbench-adp-db:
        condition: service_healthy
      workbench-redis:
        condition: service_healthy
      workbench-clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/system/config', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/lib/workbench-quarantine:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    cpus: ${ADP_CPUS:-2.0}
    mem_limit: ${ADP_MEMORY:-2g}
    pids_limit: 512
    stop_grace_period: 90s

  adp-green:
    <<: *service-defaults
    image: ${ADP_WORKBENCH_IMAGE_GREEN:?set ADP_WORKBENCH_IMAGE_GREEN to an immutable release ref}
    build: *adp-build
    environment:
      <<: *adp-environment
      WORKBENCH_INSTANCE_ID: adp-green
    secrets: *adp-secrets
    volumes:
      - adp_green_logs:/app/logs
      - ./config:/run/workbench/config:ro
      - ./secrets/oauth:/run/workbench/oauth-secrets:ro
      - ./secrets/files:/run/workbench/file-secrets:ro
      - ./secrets/sandbox:/run/secrets/workbench-sandbox:ro
    networks:
      - workbench_backend
      - workbench_egress
    depends_on:
      workbench-adp-db:
        condition: service_healthy
      workbench-redis:
        condition: service_healthy
      workbench-clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/system/config', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/lib/workbench-quarantine:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    cpus: ${ADP_CPUS:-2.0}
    mem_limit: ${ADP_MEMORY:-2g}
    pids_limit: 512
    stop_grace_period: 90s

  new-api-identity-proxy:
    <<: *service-defaults
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2.10-alpine}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      NEW_API_INTERNAL_UPSTREAM: ${NEW_API_INTERNAL_UPSTREAM:?set NEW_API_INTERNAL_UPSTREAM}
    secrets:
      - new_api_identity_tls_cert
      - new_api_identity_tls_key
    volumes:
      - ./caddy/Caddyfile.identity-proxy:/etc/caddy/Caddyfile:ro
      - identity_caddy_data:/data
      - identity_caddy_config:/config
    networks:
      workbench_backend:
        aliases:
          - new-api-identity.internal
      workbench_edge: {}
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    # The upstream Caddy binary carries cap_net_bind_service as a file
    # capability. Keep only that capability in the container bounding set;
    # otherwise no-new-privileges makes execve(caddy) fail with EPERM even
    # though this proxy listens only on unprivileged ports.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    pids_limit: 128

  workbench-switch:
    <<: *service-defaults
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2.10-alpine}
    command: ["caddy", "run", "--config", "/config-runtime/Caddyfile.active", "--adapter", "caddyfile"]
    secrets:
      - workbench_control_tls_cert
      - workbench_control_tls_key
    volumes:
      - ./state:/config-runtime:ro
      - switch_caddy_data:/data
      - switch_caddy_config:/config
    networks:
      workbench_backend:
        aliases:
          - workbench-control.internal
      workbench_edge:
        aliases:
          - claw-control-active
          - workbench-control.internal
          - adp-chat-client
    depends_on:
      new-api-identity-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null && wget -q -O - http://127.0.0.1:8000/system/config >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    pids_limit: 128

secrets:
  control_db_password:
    file: ./secrets/control_db_password
  adp_db_password:
    file: ./secrets/adp_db_password
  redis_password:
    file: ./secrets/redis_password
  claw_admin_token:
    file: ./secrets/claw_admin_token
  new_api_control_hmac:
    file: ./secrets/new_api_control_hmac
  adp_control_hmac:
    file: ./secrets/adp_control_hmac
  new_api_identity_hmac:
    file: ./secrets/new_api_identity_hmac
  evidence_master_key:
    file: ./secrets/evidence_master_key
  adp_usage_evidence_key:
    file: ./secrets/adp_usage_evidence_key
  adp_file_locator_key:
    file: ./secrets/adp_file_locator_key
  adp_file_locator_previous_keys:
    file: ./secrets/adp_file_locator_previous_keys.json
  adp_workspace_locator_key:
    file: ./secrets/adp_workspace_locator_key
  adp_workspace_locator_previous_keys:
    file: ./secrets/adp_workspace_locator_previous_keys.json
  adp_connector_token_key:
    file: ./secrets/adp_connector_token_key
  adp_connector_token_previous_keys:
    file: ./secrets/adp_connector_token_previous_keys.json
  adp_oauth_state_key:
    file: ./secrets/adp_oauth_state_key
  adp_oauth_state_previous_keys:
    file: ./secrets/adp_oauth_state_previous_keys.json
  adp_session_secret:
    file: ./secrets/adp_session_secret
  internal_ca:
    file: ./secrets/internal_ca.crt
  workbench_control_tls_cert:
    file: ./secrets/workbench_control.crt
  workbench_control_tls_key:
    file: ./secrets/workbench_control.key
  new_api_identity_tls_cert:
    file: ./secrets/new_api_identity.crt
  new_api_identity_tls_key:
    file: ./secrets/new_api_identity.key

volumes:
  control_db_data:
  evidence_data:
  adp_db_data:
  redis_data:
  clamav_db:
  adp_blue_logs:
  adp_green_logs:
  switch_caddy_data:
  switch_caddy_config:
  identity_caddy_data:
  identity_caddy_config:

networks:
  workbench_backend:
    internal: true
  workbench_egress:
    driver: bridge
  workbench_edge:
    external: true
    name: ${WORKBENCH_EDGE_NETWORK:?set WORKBENCH_EDGE_NETWORK}
