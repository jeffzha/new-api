name: ${COMPOSE_PROJECT_NAME:-claw-workbench}

x-profile: &workbench-profile
  profiles: ["claw-workbench"]

x-service-defaults: &service-defaults
  <<: *workbench-profile
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-control-environment: &control-environment
  CLAW_CONTROL_ADDR: :8090
  # Internal Docker network only. No metrics port is published to the host.
  CLAW_METRICS_ADDR: :9090
  CLAW_DB_DRIVER: postgres
  CLAW_DB_HOST: workbench-control-db
  CLAW_DB_PORT: "5432"
  CLAW_DB_NAME: ${CLAW_DB_NAME:-claw_control}
  CLAW_DB_USER: ${CLAW_DB_USER:-claw_control}
  CLAW_DB_MAX_OPEN_CONNS: ${CLAW_DB_MAX_OPEN_CONNS:-20}
  CLAW_DB_MAX_IDLE_CONNS: ${CLAW_DB_MAX_IDLE_CONNS:-5}
  CLAW_DB_CONN_MAX_LIFETIME: ${CLAW_DB_CONN_MAX_LIFETIME:-30m}
  CLAW_ENVIRONMENT: ${CLAW_ENVIRONMENT:-prod}
  CLAW_ALLOW_UNTRUSTED_PROVIDER_VERIFICATION: "false"
  CLAW_INTERNAL_HMAC_TIME_SKEW: ${CLAW_INTERNAL_HMAC_TIME_SKEW:-1m}
  CLAW_NEW_API_SERVICE_NAME: new-api-core
  CLAW_ADP_SERVICE_NAME: adp-backend
