global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/workbench-alerts.yml

scrape_configs:
  - job_name: claw-control
    metrics_path: /internal/metrics
    static_configs:
      - targets:
          - claw-control-blue:9090
          - claw-control-green:9090

  - job_name: adp-workbench
    metrics_path: /internal/metrics
    static_configs:
      - targets:
          - adp-blue:9100
          - adp-green:9100
